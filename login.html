<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<title>Öğrenci Girişi · Talent Cup</title>
<script src="app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">İçeriğe geç</a>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand-link" href="index.html"><img src="logo.png" alt="Talent Cup" width="316" height="43" /></a>

    <div class="topbar-actions">
      <button type="button" class="icon-btn" data-theme-toggle aria-pressed="false">
        <span class="visually-hidden">Koyu temaya geç</span>
        <svg data-icon="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg data-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <div class="auth-shell auth-min">
    <div class="auth-art" aria-hidden="true"></div>
    <div class="wrap auth-main">
      <div class="card auth-card">
        <h1>Öğrenci Girişi</h1>
        <p class="lead">Yarışma patikan giriş yaptıktan sonra açılır.</p>

        <form class="auth-form" method="post" action="#" novalidate>
          <div class="field">
            <label class="label" for="identifier">E-posta veya T.C. kimlik no</label>
            <input class="input" id="identifier" name="identifier" type="text" autocomplete="username" required />
          </div>
          <div class="field">
            <label class="label" for="password">Şifre</label>
            <div class="input-group">
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" required />
              <button type="button" class="icon-btn" data-password-toggle="password" aria-pressed="false">
                <span class="visually-hidden">Şifreyi göster</span>
                <svg data-icon="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg data-icon="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M10.7 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a18.4 18.4 0 0 1-3.2 4.2M6.2 6.2A18.2 18.2 0 0 0 2 12s3.6 7 10 7c1.9 0 3.5-.6 4.9-1.4"/><path d="m3 3 18 18M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
          </div>
          <!-- Sunucudan dönen hata bu alana yazılır -->
          <div class="alert" role="alert" hidden data-error><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5h.01"/></svg><span>E-posta veya şifre hatalı.</span></div>
          <button class="btn btn-primary btn-block" type="submit">Giriş Yap</button>
        </form>
        <p class="auth-or" aria-hidden="true">veya</p>
        <!-- Google ile giriş: OAuth akışı altyapıda hazır; buton oraya bağlanır -->
        <a class="btn btn-white btn-block btn-google" href="#" data-oauth="google">
          <svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2A11.9 11.9 0 0 1 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Google ile giriş yap
        </a>

        <div class="auth-foot">
          <p>Hesabın yok mu? <a href="kayit.html">Hesap oluştur</a></p>
          <p class="auth-hint">Şifreni unuttuysan öğretmenin sıfırlayabilir.</p>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>
