<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<title>Görsel üretimi · Talent Cup</title>
<script src="app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">İçeriğe geç</a>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="btn btn-white btn-sm" href="yarisma.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      Yarışma
    </a>

    <div class="topbar-center">
      <strong>3. Görsel üretimi</strong>
      <span class="small muted">Adım 3 / 5 · Alıştırma</span>
    </div>

    <div class="topbar-actions">
      <button type="button" class="icon-btn" data-theme-toggle aria-pressed="false">
        <span class="visually-hidden">Koyu temaya geç</span>
        <svg data-icon="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg data-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main" class="step-shell">
  <section class="page-banner" style="--focus-x: 45%; --focus-y: 62%">
    <div class="page-banner-art" aria-hidden="true"></div>
    <div class="wrap">
      <div class="page-banner-body" style="padding-bottom:56px">
        <span class="chip chip-brand">Adım 3 / 5 · Alıştırma</span>
        <h1>Görsel üretimi</h1>
        <p class="lead">Bu adımdaki görevleri tamamla. Bitirdiğinde bir sonraki adım otomatik olarak açılır.</p>
        <div class="progress" role="img" aria-label="5 adımdan 2 tanesi tamamlandı"><i style="width:40%"></i></div>
      </div>
    </div>
  </section>

  <div class="wrap step-body" style="padding-top:8px">
    <!-- Adım içeriği (H5P vb.) bu çerçeveye gelir -->
    <div class="step-frame"><p>Adım yükleniyor…</p></div>
    <p class="small muted" role="status" aria-live="polite" style="margin-top:16px" data-save-status>İlerlemen otomatik kaydediliyor.</p>
  </div>

  <nav class="step-nav" aria-label="Adım gezinmesi">
    <div class="wrap">
      <button type="button" class="btn btn-white btn-sm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        Geri kaydır
      </button>
      <span class="small muted">Adım 3 / 5</span>
      <button type="button" class="btn btn-primary btn-sm">
        İleri kaydır
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </nav>
</main>

</body>
</html>
