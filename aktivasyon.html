<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<title>Aktivasyon Kodu · Talent Cup</title>
<script src="app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">İçeriğe geç</a>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand-link" href="index.html"><img src="logo.png" alt="Talent Cup" width="316" height="43" /></a>

    <div class="topbar-actions">
      <button type="button" class="icon-btn" data-theme-toggle aria-pressed="false">
        <span class="visually-hidden">Koyu temaya geç</span>
        <svg data-icon="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg data-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <div class="auth-shell auth-min">
    <div class="auth-art" aria-hidden="true"></div>
    <div class="wrap auth-main">
      <div class="card auth-card">
        <h1>Aktivasyon Kodu</h1>
        <p class="lead">Kodunu gir, yarışman açılsın.</p>

        <form class="auth-form" method="post" action="#" novalidate>
          <div class="field">
            <label class="label" for="code">Aktivasyon kodu</label>
            <input class="input" id="code" name="code" type="text" autocomplete="off" spellcheck="false" required />
          </div>
          <div class="field">
            <label class="label" for="phone">Veli telefon numarası</label>
            <input class="input" id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05XX XXX XX XX" aria-describedby="phone-hint" />
            <span class="hint" id="phone-hint">Kodu kullanmak için veli telefonu doğrulanmalı.</span>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Kodu Kullan</button>
        </form>

        <div class="auth-foot">
          <p><a href="yarismalar.html">Yarışma listesine dön</a></p>
          <p class="auth-hint">Kod girme ve telefon doğrulama akışı hazırlanıyor.</p>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>
